<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Panel de Gestión PQRS</title>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Listado de Tickets PQRS</h1>
        
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-800 text-white">
                    <th class="p-3 border">Código</th>
                    <th class="p-3 border">Asunto</th>
                    <th class="p-3 border">Estado</th>
                    <th class="p-3 border">Fecha</th>
                    <th class="p-3 border text-center">Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for ticket in tickets %}
                <tr class="hover:bg-gray-50">
                    <td class="p-3 border font-semibold">{{ ticket.codigo }}</td>
                    <td class="p-3 border">{{ ticket.asunto }}</td>
                    <td class="p-3 border">
                        <span class="px-2 py-1 rounded text-sm bg-blue-100 text-blue-800 font-bold">
                            {{ ticket.estado }}
                        </span>
                    </td>
                    <td class="p-3 border">{{ ticket.fecha_creacion|date:"d/m/Y H:i" }}</td>
                    <td class="p-3 border text-center">
                        <a href="{% url 'detalle_ticket' ticket.codigo %}" class="text-blue-600 hover:underline font-bold">Ver y Gestionar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="p-6 border text-center text-gray-500">No hay tickets radicados actualmente.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
